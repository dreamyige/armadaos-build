name: Assemble (reuse package artifacts)

# 只做组装：从指定的历史 run 下载 pkgs-a / pkgs-b 两个 artifact，
# 加载镜像后构建 bootc 镜像并打 EDL 包。省掉 3 小时的包编译。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "提供 pkgs-a / pkgs-b artifact 的 run id"
        type: string
        required: true
      profile:
        description: "release = TB322FC+TB323FU"
        type: choice
        options: [release, install]
        default: release
      root_image_gib:
        description: "root 镜像大小"
        type: choice
        options: ["32", "48"]
        default: "32"

jobs:
  assemble:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Download upstream source + init git
        run: |
          set -eux
          sudo mkdir -p /work/src
          sudo chown "$(id -u):$(id -g)" /work/src
          curl -fsSL --retry 3 -o /tmp/src.tgz \
            https://codeload.github.com/ArmadaOS-Freedom/armadaos-freedom/tar.gz/refs/heads/main
          tar -xzf /tmp/src.tgz -C /work/src --strip-components=1
          # just build 的插件解析脚本要 git rev-parse HEAD
          cd /work/src
          git init -q
          git config user.email "ci@armada.local"
          git config user.name "armada-ci"
          git add -A
          git commit -qm "ci: upstream snapshot"
          git rev-parse HEAD

      - name: Install just + loop devices
        run: |
          sudo modprobe loop max_loop=64 || true
          sudo losetup -D || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uuid-runtime
          if ! command -v just >/dev/null; then
            URL=$(curl -fsSL https://api.github.com/repos/casey/just/releases/latest \
                  | jq -r '.assets[] | select(.name|test("aarch64-unknown-linux-musl\\.tar\\.gz$")) | .browser_download_url' | head -1)
            curl -fsSL "$URL" -o /tmp/just.tgz
            sudo tar -xzf /tmp/just.tgz -C /usr/local/bin just
          fi
          just --version
          docker info >/dev/null && echo "docker OK"
          podman info >/dev/null && echo "podman OK"

      - name: Download package artifacts from run
        uses: actions/download-artifact@v4
        with:
          pattern: pkgs-*
          merge-multiple: true
          path: /tmp/artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Load package images
        run: |
          set -eux
          ls -lh /tmp/artifacts
          for f in /tmp/artifacts/*.tar; do podman load -i "$f"; done
          podman images --format '{{.Repository}}:{{.Tag}}' | grep 'armada/pkg' | sort
          echo "loaded: $(podman images --format '{{.Repository}}:{{.Tag}}' | grep -c 'armada/pkg')"

      - name: Build arm64 image
        working-directory: /work/src
        run: |
          just build localhost/armada latest
          podman images

      - name: Build EDL package (unsigned)
        working-directory: /work/src
        env:
          EDL_PACKAGE_PROFILE: ${{ inputs.profile }}
          EDL_ROOT_IMAGE_GIB: ${{ inputs.root_image_gib }}
        run: |
          just build-edl-package-local \
            "ostree-image-signed:docker://ghcr.io/armadaos-freedom/armadaos-freedom:testing" \
            localhost/armada latest

      - name: List output
        working-directory: /work/src
        run: find output/edl -type f -printf '%p  %s bytes\n' | head -50

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: edl-package-unsigned
          path: /work/src/output/edl/**
          if-no-files-found: error
          compression-level: 0
